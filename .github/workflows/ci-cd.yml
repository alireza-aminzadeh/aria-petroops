name: CI/CD - Aria PetroOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: petroops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: petroops_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aria/api exec prisma generate

      - name: Build shared contracts
        run: pnpm --filter @aria/contracts build

      - name: Lint
        run: pnpm --filter @aria/api lint && pnpm --filter @aria/frontend lint

      - name: Unit tests
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/petroops_test?schema=public"
          JWT_SECRET: "ci-test-jwt-secret-not-for-production"
        run: pnpm --filter @aria/api test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alireza-aminzadeh/aria-petroops-app:latest
            ghcr.io/alireza-aminzadeh/aria-petroops-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PETROOPS_SSH_HOST }}
          username: ${{ secrets.PETROOPS_SSH_USER }}
          key: ${{ secrets.PETROOPS_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /home/deploy/.ssh/id_ed25519_github -o IdentitiesOnly=yes'
            cd /opt/aria-petroops
            if [ ! -d .git ]; then
              git clone git@github.com:alireza-aminzadeh/aria-petroops.git .
            fi
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f .env ]; then
              echo "missing /opt/aria-petroops/.env" >&2
              exit 1
            fi
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u alireza-aminzadeh --password-stdin
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -f
