# =====================================================================
# Aria PetroOps — Docker Compose (PRODUCTION-SAFE base file)
#
# طبق قواعد امنیتی پروژه:
#   - هیچ سرویس Backend (Postgres/Redis) پورتی به هاست اکسپوز نمی‌کند
#   - همهٔ سرویس‌ها فقط از طریق شبکهٔ داخلی Docker با هم صحبت می‌کنند
#   - Redis همیشه با رمز (requirepass) اجرا می‌شود
#   - restart: unless-stopped برای همهٔ سرویس‌ها
#   - هر سرویس دارای سقف/رزرو حافظه (deploy.resources.limits/reservations)
#     متناسب با سرور واقعی (91.107.149.251 — 2 vCPU / ~3.7GiB RAM)
#   - تگ نسخه‌دار برای همهٔ ایمیج‌ها (هرگز :latest)
#
# اجرای Production:  docker compose -f docker-compose.yml up -d
# اجرای Local Dev:    docker compose up -d   (override.yml خودکار merge می‌شود)
# =====================================================================

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command: ["sh", "/nginx-prod.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/prod:/etc/nginx/templates:ro
      - ./infra/docker/nginx-prod.sh:/nginx-prod.sh:ro
      - ./infra/certbot/conf:/etc/nginx/ssl:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    networks:
      - aria_petroops_net

  # ایمیج app فقط از GHCR می‌آید. build روی سرور ۲vCPU باعث OOM می‌شود.
  # Edge جداگانه روی سرور ساخته می‌شود (aria-petroops-edge:local).
  app:
    image: ghcr.io/alireza-aminzadeh/aria-petroops-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ARIA_RUNTIME: production
      CI: "true"
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-petroops}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      INDUSTRIAL_INGESTION_ENABLED: ${INDUSTRIAL_INGESTION_ENABLED:-true}
      AI_GATEWAY_ENABLED: ${AI_GATEWAY_ENABLED:-true}
      SAFEOPS_ENABLED: ${SAFEOPS_ENABLED:-false}
      SAFEOPS_API_URL: ${SAFEOPS_API_URL:-https://hse.aria-ai.ir}
      SAFEOPS_API_KEY: ${SAFEOPS_API_KEY:-}
      SAFEOPS_TIMEOUT_MS: ${SAFEOPS_TIMEOUT_MS:-8000}
    user: "1000:1000"
    volumes:
      - ./infra/docker/api-prod.sh:/api-prod.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700M
        reservations:
          memory: 350M
    networks:
      - aria_petroops_net

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # هیچ پورتی به هاست اکسپوز نمی‌شود — فقط شبکهٔ داخلی
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - aria_petroops_net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # هیچ پورتی به هاست اکسپوز نمی‌شود
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    networks:
      - aria_petroops_net

  # Mosquitto 2.0 به‌جای EMQX روی سرور 3.7GiB — MQTT 5، سبک، بدون داشبورد عمومی.
  # پورت 1883 فقط داخل شبکهٔ Docker است (هرگز 0.0.0.0).
  mqtt:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    # volume نام‌گذاری‌شده اغلب root است؛ entrypoint با root فایل رمز را می‌سازد و به mosquitto می‌دهد
    user: "0:0"
    command: ["/bin/sh", "/mosquitto/config/docker-entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-petroops}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mqtt/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" >/dev/null"]
      interval: 8s
      timeout: 5s
      retries: 12
      start_period: 12s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - aria_petroops_net

  # Edge Agent: فقط خروجی (MQTT publish). هرگز به DCS/PLC نمی‌نویسد.
  # اگر OPCUA_ENDPOINT_URL خالی باشد، شبیه‌ساز واحد نمونه را پخش می‌کند.
  edge:
    build:
      context: ./infra/edge-agent
      dockerfile: Dockerfile
    image: aria-petroops-edge:local
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-petroops}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      OPCUA_ENDPOINT_URL: ${OPCUA_ENDPOINT_URL:-}
      OPCUA_NODE_MAP: ${OPCUA_NODE_MAP:-{}}
      EDGE_INTERVAL_MS: ${EDGE_INTERVAL_MS:-2000}
    depends_on:
      mqtt:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    networks:
      - aria_petroops_net

volumes:
  pgdata:
  redisdata:
  mqtt_data:

networks:
  aria_petroops_net:
    driver: bridge
